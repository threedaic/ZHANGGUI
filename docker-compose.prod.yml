services:
  postgres:
    image: postgres:16-alpine
    container_name: crush-zhanggui-db
    environment:
      POSTGRES_USER: crush_app
      POSTGRES_PASSWORD: UXIe8QzwOLNjE3SWSImGhXbv6z_aCZhu
      POSTGRES_DB: crush_zhanggui
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crush_app -d crush_zhanggui"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: crush-zhanggui-api
    network_mode: host
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
